# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: ssrf-lab
services:
  web:
    build:
      context: ../../build/web
      labels:
        isoloom.managed: 'true'
        isoloom.environment: ssrf-lab
    image: isoloom/ssrf-lab-web
    platform: linux/amd64
    hostname: web
    networks:
      lab:
        ipv4_address: 10.60.19.10
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+80}:80
    volumes:
    - web-ctf:/ctf
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 80
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:80
      isoloom.managed: 'true'
      isoloom.environment: ssrf-lab
    restart: unless-stopped
  web-init-1:
    image: isoloom/ssrf-lab-web
    entrypoint:
    - /bin/sh
    - /isoloom/init/flag.sh
    volumes:
    - ../../ctf/flag.sh:/isoloom/init/flag.sh:ro
    - web-ctf:/ctf
    network_mode: service:web
    environment:
      CTF_FLAG_MAIN: ${CTF_FLAG_MAIN:-}
    depends_on:
      web:
        condition: service_healthy
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: ssrf-lab
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    depends_on:
      web:
        condition: service_healthy
      web-init-1:
        condition: service_completed_successfully
    labels:
      isoloom.managed: 'true'
      isoloom.environment: ssrf-lab
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: ssrf-lab
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.19.0/24
        gateway: 10.60.19.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: ssrf-lab
volumes:
  web-ctf:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: ssrf-lab
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: ssrf-lab
